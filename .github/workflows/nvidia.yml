name: NVIDIA model comparison

on:
  push:
    branches: ["arena/01a071ba-raglab"]
    paths: ["raglab/benchmarks/run_plan.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Exact-model availability probe or complete benchmark"
        type: choice
        options: [probe, benchmark, report]
        default: probe
        required: true
      source-run:
        description: "For report mode: the run ID whose diagnostics should be re-published"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: nvidia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nvidia:
    name: Exact requested NVIDIA models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read versioned experiment plan
        id: plan
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_RUN: ${{ inputs.source-run }}
        run: |
          python - <<'PY'
          import json, os
          plan = json.load(open('raglab/benchmarks/run_plan.json'))
          mode = os.environ.get('INPUT_MODE') or plan['mode']
          source = os.environ.get('INPUT_SOURCE_RUN') or plan.get('source_run', '')
          assert mode in {'probe', 'benchmark', 'report'}
          assert not source or str(source).isdigit()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'mode={mode}\nsource_run={source}\n')
          PY
      - name: Recover existing diagnostics without any model calls
        if: steps.plan.outputs.mode == 'report'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.plan.outputs.source_run }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name raglab-nvidia-results --dir raglab/results/nvidia
          python raglab/nvidia_probe.py --report-only
      - name: Probe exact model IDs (no fallback, no Gemini dependency)
        if: steps.plan.outputs.mode == 'probe'
        working-directory: raglab
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python nvidia_probe.py
      - name: Upload diagnostics (never keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-nvidia-results
          path: raglab/results/nvidia/
          retention-days: 14
          if-no-files-found: warn

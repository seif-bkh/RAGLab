name: RAGLab real test

# Real-model A/B of the two chunking arms:
#   arm "size"        — legacy recursive 220/40 chunking
#   arm "restructure" — normalization + context enrichment + recursive structural split
# Both arms ingest the docs/ corpus (4 real documents) with the pinned NVIDIA nemotron
# embeddings and evaluate raglab/questions_50.json (the adopted 50-case set) at top-k 20,
# plus one cited answer as the LLM smoke test.
# Phase 2 step 3.2 (added 2026-10-01): on the restructure collection the SAME questions
# are also evaluated in --hybrid (RRF) and --hybrid-blend modes, so one run yields the
# vector vs rrf vs blend comparison the hybrid-default decision reads. Real_report.py
# renders it as the "Retrieval modes" section when the extra run JSONs exist.
#
# This workflow SPENDS API CALLS and is opt-in only:
#   Actions -> "RAGLab real test" -> Run workflow
# A sandbox workflow_dispatch may be blocked by integration permissions (403).
# Select stage1_only=true for the isolated vector check or phase9_answer_probe=true
# for the six-case service answer probe. Scoped tag fallbacks: phase9-stage1-*
# runs retrieval only; phase9-topic-map-* runs a 12-call paired xKiro before/after
# topic-selection diagnostic; phase9-answer-* runs the six fixed Phase-9 questions
# through POST /answer with NVIDIA embeddings and the pinned free-verified xKiro
# answer model. Neither frozen question set is changed. real-test-* triggers the
# full historical workflow. The regular push CI (.github/workflows/ci.yml) stays API-free.
#
# Reading the result from the sandbox (job logs and artifact downloads are NOT reachable
# there — verified dead, see AGENTS.md §4):
#   1. the full markdown table is printed to this run's stdout (visible in the Actions UI)
#      and uploaded as the "real-test-results" artifact (the user can download it);
#   2. the compact self-sufficient key-number summary is posted as a ::warning:: annotation,
#      readable through:  gh api repos/seif-bkh/RAGLab/check-runs/<id>/annotations
#   3. on failure, the newest step-log tail is posted as an ::error:: annotation.
# The scoped paired-map job uploads `phase9-topic-map-live-probe`; the six-case
# POST /answer job uploads `phase9-answer-probe` and emits bounded case/answer/evidence
# annotations. `phase9-report-answer-<run-id>` replays that saved artifact without providers.

on:
  workflow_dispatch:
    inputs:
      stage1_only:
        description: "Run only the provisional Phase 9 Stage 1 vector-retrieval check (no answer generation)"
        required: false
        default: false
        type: boolean
      phase9_answer_probe:
        description: "Run only the six fixed Phase-9 questions through the live service POST /answer path"
        required: false
        default: false
        type: boolean
  push:
    tags: ["real-test-*", "phase9-stage1-*", "phase9-topic-map-*", "phase9-answer-*", "phase9-report-answer-*"]

permissions:
  contents: read

concurrency:
  group: real-test
  cancel-in-progress: false

jobs:
  real-test:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.stage1_only != true && inputs.phase9_answer_probe != true)) && !startsWith(github.ref, 'refs/tags/phase9-stage1-') && !startsWith(github.ref, 'refs/tags/phase9-topic-map-') && !startsWith(github.ref, 'refs/tags/phase9-answer-') && !startsWith(github.ref, 'refs/tags/phase9-report-answer-') }}
    name: Real A/B — NVIDIA embeddings + xKiro/Qwen answer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repo secrets, added by the repository owner. Referenced by name only; values are
      # never printed whole (repo convention: at most the first 8 characters).
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Fail fast if the secrets are missing or empty
        run: |
          missing=0
          for name in NVIDIA_API_KEY XKIRO_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Actions secret $name is empty — the real test needs both keys in the repository secrets"
              missing=1
            else
              echo "$name present (prefix ${value:0:8})"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: ARM=size — ingest (NVIDIA embeddings) + evaluate
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=size
          mkdir -p /tmp/raglab_ci results/harness50
          python main.py ingest --reset --skip-sanity-check \
            --data-dir ../docs --data-dir data 2>&1 | tee /tmp/raglab_ci/size_ingest.log
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/size_evaluate.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/real_eval_size.json
          echo "eval run preserved as results/harness50/real_eval_size.json (source: $newest)"

      - name: ARM=restructure — ingest (NVIDIA embeddings) + evaluate
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          python main.py ingest --reset --skip-sanity-check \
            --data-dir ../docs --data-dir data 2>&1 | tee /tmp/raglab_ci/restructure_ingest.log
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/restructure_evaluate.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/real_eval_restructure.json
          echo "eval run preserved as results/harness50/real_eval_restructure.json (source: $newest)"

      - name: Retrieval modes on ARM=restructure — rrf + blend (step 3.2)
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          python main.py evaluate --skip-sanity-check --no-translation --hybrid \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/restructure_evaluate_rrf.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/real_eval_restructure_rrf.json
          echo "eval run preserved as results/harness50/real_eval_restructure_rrf.json (source: $newest)"
          python main.py evaluate --skip-sanity-check --no-translation --hybrid-blend \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/restructure_evaluate_blend.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/real_eval_restructure_blend.json
          echo "eval run preserved as results/harness50/real_eval_restructure_blend.json (source: $newest)"

      - name: Reranker on ARM=restructure — vector + deterministic rerank (Phase-3 intervention 3)
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          export RERANK_ENABLED=1
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/restructure_evaluate_rerank.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/real_eval_restructure_rerank.json
          echo "eval run preserved as results/harness50/real_eval_restructure_rerank.json (source: $newest)"

      - name: Target-category set (questions_targets.json) — deployed default vs lexicon-on
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          # run 1: the deployed default (vector + rerank, now ON by default)
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_targets.json 2>&1 | tee /tmp/raglab_ci/targets_default.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/targets_default.json
          # run 2: same pipeline with the governed lexicon enabled
          export LEXICON_ENABLED=1
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_targets.json 2>&1 | tee /tmp/raglab_ci/targets_lexicon.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/targets_lexicon.json
          unset LEXICON_ENABLED

      - name: Post the target-set numbers as an annotation
        if: always()
        working-directory: raglab
        run: |
          python3 - <<'EOF'
          import json
          parts = []
          for label, path in (("deployed", "results/harness50/targets_default.json"),
                              ("lexicon", "results/harness50/targets_lexicon.json")):
              try:
                  m = json.load(open(path, encoding="utf-8"))["metrics"]
              except Exception:
                  continue
              o = m["overall"]
              cats = " ".join(
                  f"{k} {d['n']}:{(d['hit@1'] or 0)*100:.0f}/{(d['hit@3'] or 0)*100:.0f}/{(d['hit@5'] or 0)*100:.0f}"
                  for k, d in sorted(m.get("by_category", {}).items()))
              parts.append(f"{label} n={o['n']} overall="
                           f"{(o['hit@1'] or 0)*100:.0f}/{(o['hit@3'] or 0)*100:.0f}/{(o['hit@5'] or 0)*100:.0f} "
                           f"[{cats}]")
          msg = " | ".join(parts) if parts else "no run JSONs found"
          print("ANNO| targets-set | " + msg)          # log-readable form
          enc = msg.replace("%", "%25").replace(":", "%3A")
          print(f"::warning::targets-set | {enc}")     # annotation channel
          EOF

      - name: Units index (Phase-4 item 5) — description lines vs the adopted baseline
        working-directory: raglab
        run: |
          set -o pipefail
          python unit_index.py --live \
            --baseline results/harness50/real_eval_restructure.json \
            2>&1 | tee /tmp/raglab_ci/units_index.log
          cp results/harness50/unit_index_eval.json results/harness50/real_eval_unit_index.json

      - name: Post the units-index numbers as an annotation
        if: always()
        working-directory: raglab
        run: |
          line=$(grep -h '^ANNO|' /tmp/raglab_ci/units_index.log 2>/dev/null | tail -1 || true)
          if [ -n "$line" ]; then
            message=${line#ANNO| }
            printf '::warning::%s\n' \
              "$(printf '%s' "$message" | sed -e 's/%/%25/g' -e 's/:/%3A/g')"
          else
            echo "no units-index ANNO found"
          fi

      - name: Relational expansion (Phase-5 item 3) — deployed default vs expansion-on
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          export RELATIONAL_EXPANSION_ENABLED=1
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/expansion_50.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/expansion_50.json
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_targets.json 2>&1 | tee /tmp/raglab_ci/expansion_targets.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/expansion_targets.json

      - name: Sufficiency on the live vector arm (Phase 5 item 4 + Phase 6)
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          python sufficiency.py --live 2>&1 | tee /tmp/raglab_ci/sufficiency_live.log
      - name: Per-micro retrieval (Experiment 3) — deployed vs per-micro fusion
        working-directory: raglab
        run: |
          set -o pipefail
          export CHUNKING_MODE=restructure
          export PER_MICRO_RETRIEVAL_ENABLED=1
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_50.json 2>&1 | tee /tmp/raglab_ci/micro_50.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/micro_50.json
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions questions_targets.json 2>&1 | tee /tmp/raglab_ci/micro_targets.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/harness50/micro_targets.json

      - name: Post the per-micro numbers as an annotation
        if: always()
        working-directory: raglab
        run: |
          python3 - <<'EOF'
          import json
          def overall(path):
              try:
                  return json.load(open(path, encoding="utf-8"))["metrics"]["overall"]
              except Exception:
                  return None
          def fmt(o):
              if not o:
                  return "n/a"
              return (f"{(o['hit@1'] or 0)*100:.0f}/{(o['hit@3'] or 0)*100:.0f}/"
                      f"{(o['hit@5'] or 0)*100:.0f}")
          parts = []
          b50 = overall("results/harness50/real_eval_restructure.json")
          m50 = overall("results/harness50/micro_50.json")
          if b50 and m50:
              parts.append(f"50set base {fmt(b50)} vs micro {fmt(m50)}")
          bt = overall("results/harness50/targets_default.json")
          mt = overall("results/harness50/micro_targets.json")
          if bt and mt:
              parts.append(f"targets base {fmt(bt)} vs micro {fmt(mt)}")
          msg = " | ".join(parts) if parts else "no per-micro run JSONs found"
          print("ANNO| per-micro | " + msg)
          enc = msg.replace("%", "%25").replace(":", "%3A").replace("|", "%7C")
          print(f"::warning::per-micro | {enc}")
          EOF

      - name: Post the sufficiency distribution as an annotation
        if: always()
        working-directory: raglab
        run: |
          python3 - <<'EOF'
          import re
          try:
              log = open("/tmp/raglab_ci/sufficiency_live.log", encoding="utf-8").read()
          except OSError:
              print("::warning::sufficiency-live | no log"); raise SystemExit(0)
          # keep the JSON body of the report (starts at the first '{')
          i = log.find("{")
          if i < 0:
              print("::warning::sufficiency-live | no report"); raise SystemExit(0)
          import json
          try:
              report = json.loads(log[i:])
          except json.JSONDecodeError:
              print("::warning::sufficiency-live | unparseable report"); raise SystemExit(0)
          parts = []
          for name, m in report.items():
              states = " ".join(f"{k}={v}" for k, v in m.get("states", {}).items())
              per = m.get("per_case_compact") or []
              dis = [r["id"] for r in per
                     if (r["state"] == "كافٍ" and r["expected"] == "غير كافٍ")
                     or (r["state"] == "غير كافٍ" and r["expected"] == "كافٍ")]
              refused_before = [r["id"] for r in per
                                if r["state"] == "غير كافٍ" and r["n_covered"] == 0]
              partial = [r["id"] for r in per
                         if r["state"] == "غير كافٍ" and r["n_covered"] > 0]
              parts.append(f"{name}: {states} | FS={m.get('false_sufficient')} "
                           f"FR={m.get('false_refusal')} esc={m.get('escalated')} "
                           f"agree={m.get('agreement')} | disagree={','.join(dis) or '-'} "
                           f"| commitment: refused-before-model={len(refused_before)} "
                           f"({','.join(refused_before) or '-'}) partial={len(partial)}")
          msg = " | ".join(parts)
          print("ANNO| sufficiency-live | " + msg)
          enc = msg.replace("%", "%25").replace(":", "%3A").replace("|", "%7C")
          print(f"::warning::sufficiency-live | {enc}")
          open("results/harness50/sufficiency_live.json", "w",
               encoding="utf-8").write(json.dumps(report, ensure_ascii=False, indent=1))
          EOF

      - name: Post the expansion numbers as an annotation
        if: always()
        working-directory: raglab
        run: |
          python3 - <<'EOF'
          import json
          def overall(path):
              try:
                  return json.load(open(path, encoding="utf-8"))["metrics"]["overall"]
              except Exception:
                  return None
          def fmt(o):
              if not o:
                  return "n/a"
              return (f"{(o['hit@1'] or 0)*100:.0f}/{(o['hit@3'] or 0)*100:.0f}/"
                      f"{(o['hit@5'] or 0)*100:.0f}")
          parts = []
          base50 = overall("results/harness50/real_eval_restructure.json")
          exp50 = overall("results/harness50/expansion_50.json")
          if base50 and exp50:
              parts.append(f"50set base {fmt(base50)} vs exp {fmt(exp50)}")
          baseT = overall("results/harness50/targets_default.json")
          expT = overall("results/harness50/expansion_targets.json")
          if baseT and expT:
              parts.append(f"targets base {fmt(baseT)} vs exp {fmt(expT)}")
          msg = " | ".join(parts) if parts else "no expansion run JSONs found"
          print("ANNO| expansion | " + msg)
          enc = msg.replace("%", "%25").replace(":", "%3A")
          print(f"::warning::expansion | {enc}")
          EOF

      # continue-on-error: the retrieval A/B is the deliverable; an answer-smoke failure is
      # reported as data (below) instead of hiding the tables.
      # NOTE: GitHub wraps run-steps in `bash -e -o pipefail`, so a failing command aborts
      # the script BEFORE any `status=$?` capture. The `|| status=$?` idiom is required.
      # LLM role per owner instruction (2026-09-07): nvidia/nemotron-3.5-lightning-30b-a3b via
      # the NVIDIA build endpoint (NVIDIA_API_KEY); if that fails, GOOGLE_API_KEY with the
      # cheapest free-tier Gemini model. llm_smoke.py handles the retries and the fallback
      # internally (the pinned app profile xkiro/qwen kept hitting free-tier capacity 502s, so
      # the smoke no longer goes through main.py answer).
      # NOTE: GitHub wraps run-steps in `bash -e -o pipefail`, so exit capture needs the
      # `|| status=$?` idiom (a bare `status=$?` never runs).
      - name: Answer smoke test — cited answer, NVIDIA Nemotron-3.5 Lightning (restructure collection loaded)
        continue-on-error: true
        working-directory: raglab
        run: |
          export CHUNKING_MODE=restructure
          status=0
          python llm_smoke.py --question "ما هي المرابحة؟" --query-lang ar \
            --output results/harness50/real_answer_murabaha.json \
            > /tmp/raglab_ci/answer.log 2>&1 || status=$?
          echo "$status" > /tmp/raglab_ci/answer_status
          cat /tmp/raglab_ci/answer.log

      - name: Build the comparison table
        if: always()
        working-directory: raglab
        run: |
          if [ ! -f results/harness50/real_eval_size.json ] || [ ! -f results/harness50/real_eval_restructure.json ]; then
            echo "One of the eval runs is missing; skipping the report (the failure step carries the diagnostic)."
            exit 0
          fi
          answer_arg=""
          [ -f results/harness50/real_answer_murabaha.json ] && answer_arg="--answer results/harness50/real_answer_murabaha.json"
          modes_arg=""
          [ -f results/harness50/real_eval_restructure_rrf.json ] && modes_arg="$modes_arg --rrf results/harness50/real_eval_restructure_rrf.json"
          [ -f results/harness50/real_eval_restructure_blend.json ] && modes_arg="$modes_arg --blend results/harness50/real_eval_restructure_blend.json"
          [ -f results/harness50/real_eval_restructure_rerank.json ] && modes_arg="$modes_arg --rerank results/harness50/real_eval_restructure_rerank.json"
          python real_report.py results/harness50/real_eval_size.json \
            results/harness50/real_eval_restructure.json \
            --out results/harness50/real_models.md $answer_arg $modes_arg \
            2>&1 | tee /tmp/raglab_ci/report.log

      - name: Post the key numbers as a check-run annotation (sandbox-readable channel)
        if: always()
        run: |
          line=$(grep -h '^ANNO|' /tmp/raglab_ci/report.log 2>/dev/null | tail -1 || true)
          if [ -n "$line" ]; then
            message=${line#ANNO| }
            printf '::warning::real-test numbers | %s\n' \
              "$(printf '%s' "$message" | sed -e 's/%/%25/g' -e 's/:/%3A/g')"
          else
            echo "::warning::real-test produced no ANNO line; the failure step or the logs carry the diagnostic"
          fi

      - name: Fail the run if the answer smoke failed (tables are already published above)
        if: always()
        working-directory: raglab
        run: |
          status=$(cat /tmp/raglab_ci/answer_status 2>/dev/null || echo "")
          if [ -z "$status" ] || [ "$status" = "0" ]; then
            exit 0
          fi
          touch /tmp/raglab_ci/answer_failed
          diag=""
          if [ -f results/harness50/real_answer_murabaha.json ]; then
            diag=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1],encoding='utf-8'));ks=('provider','model','phase','status','reason','http_status','served_model','nvidia_attempt','error');print(' | '.join(f'{k}={d[k]!r}' for k in ks if d.get(k) is not None)[:1000])" results/harness50/real_answer_murabaha.json 2>/dev/null || echo "answer JSON unreadable")
          fi
          echo "::error::answer smoke exited with status $status${diag:+ — $diag}"
          echo "::error::answer.log tail: $(tail -c 1000 /tmp/raglab_ci/answer.log | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')"
          exit 1

      - name: Report the failure (job logs are not downloadable from the sandbox)
        if: failure()
        run: |
          if [ -f /tmp/raglab_ci/answer_failed ]; then
            echo "::warning::answer-smoke failure already annotated above; nothing more to add"
            exit 0
          fi
          newest=$(ls -t /tmp/raglab_ci/*.log 2>/dev/null | head -1 || true)
          if [ -n "$newest" ]; then
            message=$(tail -c 1400 "$newest" | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')
            echo "::error::real-test failed; tail of ${newest##*/}: $message"
          else
            echo "::error::real-test failed before any step log existed (dependency install or earlier)"
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-test-results
          path: |
            raglab/results/harness50/real_models.md
            raglab/results/harness50/real_eval_size.json
            raglab/results/harness50/real_eval_restructure.json
            raglab/results/harness50/real_eval_restructure_rrf.json
            raglab/results/harness50/real_eval_restructure_blend.json
            raglab/results/harness50/real_eval_restructure_rerank.json
            raglab/results/harness50/targets_default.json
            raglab/results/harness50/targets_lexicon.json
            raglab/results/harness50/real_eval_unit_index.json
            raglab/results/harness50/expansion_50.json
            raglab/results/harness50/expansion_targets.json
            raglab/results/harness50/sufficiency_live.json
            raglab/results/harness50/micro_50.json
            raglab/results/harness50/micro_targets.json
            raglab/results/harness50/real_answer_murabaha.json
          if-no-files-found: ignore
          retention-days: 30

  phase9-stage1-vector:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage1_only == true && inputs.phase9_answer_probe != true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase9-stage1-')) }}
    name: Phase 9 Stage 1 — vector retrieval only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install core dependencies
        working-directory: raglab
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Fail fast if the NVIDIA embedding secret is unavailable
        shell: bash
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::Actions secret NVIDIA_API_KEY is empty; no model calls were made."
            exit 1
          fi
          echo "NVIDIA_API_KEY present (value not displayed)."

      - name: Ingest the adopted corpus once (restructure)
        working-directory: raglab
        env:
          CHUNKING_MODE: restructure
          LEXICON_ENABLED: "0"
          QUERY_TRANSLATION_ENABLED: "0"
          RELATIONAL_EXPANSION_ENABLED: "0"
          PER_MICRO_RETRIEVAL_ENABLED: "0"
          RERANK_ENABLED: "0"
        run: |
          set -o pipefail
          mkdir -p results/phase9_stage1
          python main.py ingest --reset --skip-sanity-check \
            --data-dir ../docs --data-dir data \
            2>&1 | tee /tmp/phase9_stage1_ingest.log
          cp /tmp/phase9_stage1_ingest.log results/phase9_stage1/ingest.log

      - name: Build an isolated evaluator view of evidence-bearing cases
        working-directory: raglab
        run: python audits/PHASE9_STRUCTURE/build_stage1_vector_questions.py

      - name: Evaluate dense vector retrieval (reranker off)
        working-directory: raglab
        env:
          CHUNKING_MODE: restructure
          LEXICON_ENABLED: "0"
          QUERY_TRANSLATION_ENABLED: "0"
          RELATIONAL_EXPANSION_ENABLED: "0"
          PER_MICRO_RETRIEVAL_ENABLED: "0"
          RERANK_ENABLED: "0"
        run: |
          set -o pipefail
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions results/phase9_stage1/stage1_vector_questions.json \
            2>&1 | tee /tmp/phase9_stage1_vector_only.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/phase9_stage1/stage1_vector_only.json

      - name: Evaluate deployed vector retrieval (deterministic reranker on)
        working-directory: raglab
        env:
          CHUNKING_MODE: restructure
          LEXICON_ENABLED: "0"
          QUERY_TRANSLATION_ENABLED: "0"
          RELATIONAL_EXPANSION_ENABLED: "0"
          PER_MICRO_RETRIEVAL_ENABLED: "0"
          RERANK_ENABLED: "1"
        run: |
          set -o pipefail
          python main.py evaluate --skip-sanity-check --no-translation \
            --top-k 20 --questions results/phase9_stage1/stage1_vector_questions.json \
            2>&1 | tee /tmp/phase9_stage1_vector_default.log
          newest=$(ls -t results/eval_*.json | head -1)
          cp "$newest" results/phase9_stage1/stage1_vector_default.json

      - name: Publish concise results
        if: always()
        working-directory: raglab
        shell: bash
        run: |
          set +e
          python audits/PHASE9_STRUCTURE/summarize_stage1_vector.py \
            | tee /tmp/phase9_stage1_summary.md
          if [ -f results/phase9_stage1/stage1_vector_summary.md ]; then
            cat results/phase9_stage1/stage1_vector_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          msg=$(grep '^ANNO| phase9-stage1-vector | ' /tmp/phase9_stage1_summary.md | tail -1)
          if [ -n "$msg" ]; then
            msg=${msg#ANNO| phase9-stage1-vector | }
            escaped=$(python -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")' <<< "$msg")
            echo "::warning::phase9-stage1-vector | $escaped"
          else
            echo "::warning::phase9-stage1-vector | no evaluation summary available"
          fi

      - name: Upload retrieval-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-stage1-vector-retrieval
          if-no-files-found: warn
          path: |
            raglab/results/phase9_stage1/stage1_vector_questions.json
            raglab/results/phase9_stage1/stage1_vector_only.json
            raglab/results/phase9_stage1/stage1_vector_default.json
            raglab/results/phase9_stage1/stage1_vector_summary.md
            raglab/results/phase9_stage1/ingest.log

  phase9-topic-map-live:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase9-topic-map-') }}
    name: Phase 9 — paired live topic-map comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # load the exact pre-enrichment source from BASELINE_COMMIT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install runtime dependencies
        working-directory: raglab
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Fail fast if the pinned xKiro secret is unavailable
        shell: bash
        run: |
          if [ -z "${XKIRO_API_KEY:-}" ]; then
            echo "::error::Actions secret XKIRO_API_KEY is empty; no model calls were made."
            exit 1
          fi
          echo "XKIRO_API_KEY present (value not displayed)."

      - name: Run the 12-call paired interrogation-only comparison
        working-directory: raglab
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/phase9_topic_map results/phase9_topic_map
          status=0
          python audits/PHASE9_STRUCTURE/run_topic_map_live_probe.py \
            2>&1 | tee /tmp/phase9_topic_map/live_probe.log || status=$?
          echo "$status" > /tmp/phase9_topic_map/status
          if [ -f /tmp/phase9_topic_map/live_probe.log ]; then
            cp /tmp/phase9_topic_map/live_probe.log results/phase9_topic_map/live_probe.log
          fi
          exit 0

      - name: Publish summary and check-run annotation
        if: always()
        working-directory: raglab
        shell: bash
        run: |
          if [ -f results/phase9_topic_map/live_probe_results.md ]; then
            cat results/phase9_topic_map/live_probe_results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          line=$(grep '^ANNO| phase9-topic-map | ' /tmp/phase9_topic_map/live_probe.log 2>/dev/null | tail -1 || true)
          if [ -n "$line" ]; then
            message=${line#ANNO| phase9-topic-map | }
            escaped=$(printf '%s' "$message" | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')
            echo "::warning::phase9-topic-map | $escaped"
          elif [ -f results/phase9_topic_map/live_probe_results.json ]; then
            echo "::warning::phase9-topic-map | output saved; no compact summary was emitted"
          else
            echo "::warning::phase9-topic-map | no result file; inspect the step failure"
          fi

      - name: Fail if a provider call or probe setup failed
        if: always()
        shell: bash
        run: |
          status=$(cat /tmp/phase9_topic_map/status 2>/dev/null || echo "")
          if [ -n "$status" ] && [ "$status" != "0" ]; then
            echo "::error::topic-map probe had provider/setup errors; the diagnostic artifact is still uploaded"
            echo "::error::probe log tail: $(tail -c 1400 /tmp/phase9_topic_map/live_probe.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')"
            exit 1
          fi

      - name: Upload topic-map diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-topic-map-live-probe
          path: |
            raglab/results/phase9_topic_map/live_probe_results.json
            raglab/results/phase9_topic_map/live_probe_results.md
            raglab/results/phase9_topic_map/live_probe.log
          if-no-files-found: warn
          retention-days: 30
  phase9-answer-probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.phase9_answer_probe == true && inputs.stage1_only != true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase9-answer-')) }}
    name: Phase 9 — six-case end-to-end answers through POST /answer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      CHUNKING_MODE: restructure
      ANSWER_SUFFICIENCY_COMMITMENT: "1"
      REPHRASE_INTERROGATION_ENABLED: "1"
      SUFFICIENCY_FIELDS_ENABLED: "1"
      RAGLAB_ALLOW_PROFILE_SWITCH: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements-service.txt

      - name: Install service and HTTP-client dependencies
        working-directory: raglab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-service.txt httpx==0.28.1

      - name: Validate six unchanged cases and active targets (no API)
        working-directory: raglab
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/phase9_answer_probe
          status=0
          python audits/PHASE9_STRUCTURE/run_phase9_answer_probe.py --validate-only \
            2>&1 | tee /tmp/phase9_answer_probe/validation.log || status=$?
          echo "$status" > /tmp/phase9_answer_probe/validation_status
          if [ "$status" -ne 0 ]; then
            tail_text=$(tail -c 1800 /tmp/phase9_answer_probe/validation.log \
              | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')
            echo "::error::Phase-9 answer preflight failed: $tail_text"
            exit "$status"
          fi

      - name: Fail fast if an approved provider secret is missing
        shell: bash
        run: |
          missing=0
          for name in NVIDIA_API_KEY XKIRO_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Actions secret $name is empty; no embedding or model calls will be made."
              missing=1
            else
              echo "$name present (value not displayed)."
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Ingest and ask the six questions through POST /answer
        working-directory: raglab
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/phase9_answer_probe results/phase9_answer_probe
          status=0
          python audits/PHASE9_STRUCTURE/run_phase9_answer_probe.py \
            --output results/phase9_answer_probe/live_answer_results.json \
            2>&1 | tee /tmp/phase9_answer_probe/live_answer.log || status=$?
          echo "$status" > /tmp/phase9_answer_probe/status
          cp /tmp/phase9_answer_probe/live_answer.log \
            results/phase9_answer_probe/live_answer.log 2>/dev/null || true
          exit 0

      - name: Publish case-level answers and evidence
        if: always()
        working-directory: raglab
        shell: bash
        run: |
          mkdir -p results/phase9_answer_probe
          if [ -f /tmp/phase9_answer_probe/validation.log ]; then
            cp /tmp/phase9_answer_probe/validation.log \
              results/phase9_answer_probe/validation.log 2>/dev/null || true
            if [ "$(cat /tmp/phase9_answer_probe/validation_status 2>/dev/null || echo 0)" != "0" ]; then
              echo '### Preflight failure log' >> "$GITHUB_STEP_SUMMARY"
              tail -n 60 /tmp/phase9_answer_probe/validation.log >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -f results/phase9_answer_probe/live_answer_results.md ]; then
            cat results/phase9_answer_probe/live_answer_results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q '^ANNO| phase9-answer-' /tmp/phase9_answer_probe/live_answer.log 2>/dev/null; then
            while IFS= read -r line; do
              label=${line#ANNO| }
              label=${label%% | *}
              message=${line#* | }
              escaped=$(printf '%s' "$message" | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')
              echo "::warning::$label | $escaped"
            done < <(grep '^ANNO| phase9-answer-' /tmp/phase9_answer_probe/live_answer.log)
          elif [ -f results/phase9_answer_probe/live_answer_results.json ]; then
            echo "::warning::phase9-answer | report saved; compact annotations unavailable"
          else
            echo "::warning::phase9-answer | no report file; inspect the step failure"
          fi

      - name: Fail if setup or provider calls failed
        if: always()
        shell: bash
        run: |
          status=$(cat /tmp/phase9_answer_probe/status 2>/dev/null || echo "")
          if [ -n "$status" ] && [ "$status" != "0" ]; then
            echo "::error::Phase-9 answer probe had setup/provider/HTTP errors; diagnostic artifact is uploaded"
            echo "::error::probe log tail: $(tail -c 1600 /tmp/phase9_answer_probe/live_answer.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')"
            exit 1
          fi

      - name: Upload end-to-end answer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-answer-probe
          path: |
            raglab/results/phase9_answer_probe/live_answer_results.json
            raglab/results/phase9_answer_probe/live_answer_results.md
            raglab/results/phase9_answer_probe/live_answer.log
            raglab/results/phase9_answer_probe/validation.log
          if-no-files-found: warn
          retention-days: 30

  phase9-answer-report-replay:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase9-report-answer-') }}
    name: Phase 9 — re-publish saved answers and evidence (no provider calls)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Parse source run ID from tag
        id: source
        shell: bash
        run: |
          run_id="${GITHUB_REF_NAME#phase9-report-answer-}"
          case "$run_id" in
            ''|*[!0-9]*) echo "::error::tag suffix must be a numeric Actions run ID"; exit 2 ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the completed answer-probe report (no inference)
        uses: actions/download-artifact@v4
        with:
          name: phase9-answer-probe
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: phase9_prior_run

      - name: Emit bounded per-case annotations from the saved JSON
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/phase9_answer_report
          python raglab/audits/PHASE9_STRUCTURE/run_phase9_answer_probe.py \
            --emit-report phase9_prior_run/live_answer_results.json \
            2>&1 | tee /tmp/phase9_answer_report/emit.log
          while IFS= read -r line; do
            label=${line#ANNO| }
            label=${label%% | *}
            message=${line#* | }
            escaped=$(printf '%s' "$message" | sed -e 's/%/%25/g' -e 's/:/%3A/g' | tr '\n' '|')
            echo "::warning::$label | $escaped"
          done < <(grep '^ANNO| phase9-answer-' /tmp/phase9_answer_report/emit.log)

      - name: Publish the complete saved Markdown report
        if: always()
        shell: bash
        run: |
          if [ -f phase9_prior_run/live_answer_results.md ]; then
            cat phase9_prior_run/live_answer_results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the saved answer-probe Markdown report was not found"
            exit 1
          fi

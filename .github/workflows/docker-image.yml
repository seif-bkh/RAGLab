# RAGLab docker image — build the multi-stage production image (Dockerfile.prod),
# prove it serves with zero network (`docker run --network none` smoke), and
# publish it where anyone can download it:
#
#   * push tag `v*`            -> build + offline smoke + PUSH to GHCR
#                                 (ghcr.io/seif-bkh/raglab-service:<version> and :latest)
#                                 + attach the exported .tar.gz to a GitHub Release
#   * Actions -> this workflow -> Run (workflow_dispatch)
#     defaults                  -> build + offline smoke ONLY (nothing published)
#     push=true                 -> build + offline smoke + publish GHCR + Release assets
#
# Version policy: the image tag should mirror SERVICE_VERSION in
# raglab/service.py (the release flow: bump SERVICE_VERSION -> push -> tag
# `v<x.y.z>` -> push the tag). The workflow warns when they diverge.
#
# Results are emitted as annotations (::notice::/::error::) so a sandboxed
# session can read the outcome via the check-run annotations API (AGENTS.md §4).
name: RAGLab docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "image tag (default: dev-<sha>); NOT a service change"
        required: false
        default: ""
      push:
        description: "also publish to GHCR + a GitHub Release with the tarball"
        type: boolean
        default: false

permissions:
  contents: write      # create the GitHub Release on publish
  packages: write      # push to ghcr.io

env:
  IMAGE: ghcr.io/seif-bkh/raglab-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and publishing mode
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            PUBLISH="true"
          else
            V="${{ inputs.version }}"
            PUBLISH="${{ inputs.push }}"
          fi
          [ -n "$V" ] || V="dev-$(git rev-parse --short HEAD)"
          echo "$V" | grep -qE '^[A-Za-z0-9_.-]+$' || { echo "::error::invalid version '$V' (docker tag charset)"; exit 1; }
          SVC="$(sed -n 's/^SERVICE_VERSION = "\([^"]*\)".*/\1/p' raglab/service.py | head -1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ -n "$SVC" ] && [ "$V" != "$SVC" ]; then
            echo "::warning::image tag '$V' != SERVICE_VERSION '$SVC' in raglab/service.py (release policy: keep them aligned)"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (publish only)
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        run: |
          set -o pipefail
          EXTRA=(--load)
          if [ "${{ steps.meta.outputs.publish }}" = "true" ]; then
            EXTRA=(--push --provenance=true --sbom=true)
          fi
          docker buildx build -f Dockerfile.prod \
            --build-arg SERVICE_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg VCS_REF="${GITHUB_SHA::8}" \
            -t "$IMAGE:${{ steps.meta.outputs.version }}" -t "$IMAGE:latest" \
            "${EXTRA[@]}" . 2>&1 | tee /tmp/build.log

      - name: Offline smoke — the container serves with NO network
        run: |
          set -euo pipefail
          TAG="$IMAGE:${{ steps.meta.outputs.version }}"
          docker run -d --name raglab-smoke --network none \
            -e RAGLAB_SERVICE_TOKEN=ci-smoke-token -e RAGLAB_ALLOW_PROFILE_SWITCH=1 \
            "$TAG" >/dev/null
          trap 'docker rm -f raglab-smoke >/dev/null 2>&1 || true' EXIT
          # readiness via the image's own healthcheck script (inside the
          # --network none container): answers only once /health serves 200/401
          timeout 45 bash -c 'until docker exec raglab-smoke python /app/raglab/container_healthcheck.py; do sleep 2; done'
          docker cp docker/offline_smoke.py raglab-smoke:/tmp/offline_smoke.py
          docker exec -e SMOKE_TOKEN=ci-smoke-token raglab-smoke \
            python /tmp/offline_smoke.py | tee /tmp/smoke.log
          # the image HEALTHCHECK itself must go green with zero network:
          healthy="no"
          for _ in $(seq 1 12); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' raglab-smoke)"
            [ "$status" = "healthy" ] && { healthy="yes"; break; }
            sleep 5
          done
          echo "[smoke] container health status: $status" | tee -a /tmp/smoke.log
          [ "$healthy" = "yes" ]
          docker logs raglab-smoke 2>&1 | tail -5 | tee -a /tmp/smoke.log
          echo "::notice::OFFLINE SMOKE PASSED — the image serves with --network none (health+token+tiktoken, healthcheck=$status)"

      - name: Export tarball + publish GHCR/Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE:$V"   # the pushed image is registry-side; round-trip it for the export
          mkdir -p dist
          docker save "$IMAGE:$V" | gzip -1 > "dist/raglab-service_${V}.tar.gz"
          ( cd dist && sha256sum "raglab-service_${V}.tar.gz" > "raglab-service_${V}.tar.gz.sha256" )
          SIZE="$(du -h "dist/raglab-service_${V}.tar.gz" | cut -f1)"
          if [ "${{ github.event_name }}" = "push" ]; then REF="$GITHUB_REF_NAME"; else REF="image-$V"; fi
          if ! gh release view "$REF" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              gh release create "$REF" --repo "${{ github.repository }}" \
                --title "RAGLab service image $V" --generate-notes || true
            else
              gh release create "$REF" --repo "${{ github.repository }}" \
                --title "RAGLab service image $V" --target "$(git rev-parse HEAD)" \
                --notes "Manual publish of the production image (workflow_dispatch). Pull: \`docker pull $IMAGE:$V\`, or load the attached tarball offline." || true
            fi
          fi
          gh release upload "$REF" --repo "${{ github.repository }}" \
            "dist/raglab-service_${V}.tar.gz" "dist/raglab-service_${V}.tar.gz.sha256" --clobber
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$V" --format '{{.Manifest.Digest}}' 2>/dev/null || echo unknown)"
          echo "::notice::PUBLISHED $IMAGE:$V (+:latest) digest=$DIGEST tarball=$SIZE — pull: docker pull $IMAGE:$V — offline: download raglab-service_$V.tar.gz from Release '$REF' and 'gunzip -c | docker load'"

      - name: Run summary (annotations API readable)
        if: success()
        run: |
          if [ "${{ steps.meta.outputs.publish }}" = "true" ]; then
            echo "::notice::docker-image result: $IMAGE:${{ steps.meta.outputs.version }} built, offline-smoked and PUBLISHED (GHCR + Release assets)"
          else
            echo "::notice::docker-image result: $IMAGE:${{ steps.meta.outputs.version }} built + offline-smoked (build-only; publish with tag v* or push=true)"
          fi

      - name: Failure diagnostics (annotations API readable)
        if: failure()
        run: |
          echo "::error::docker-image pipeline failed. Build log tail:"
          tail -n 30 /tmp/build.log 2>/dev/null || echo "(no build log captured)"
          echo "::error::smoke log tail:"
          tail -n 30 /tmp/smoke.log 2>/dev/null || echo "(no smoke log captured)"
          docker logs raglab-smoke --tail 20 2>/dev/null || true

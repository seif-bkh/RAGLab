name: RAGLab CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # only used by the failure reporter (never for secrets)

jobs:
  # ---------------------------------------------------------------- offline
  compile-offline:
    name: Compile + offline inspect (no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Compile all modules
        run: python -m py_compile config.py loader.py chunker.py embedder.py store.py evaluate.py answer.py main.py ci_test.py
        working-directory: raglab

      - name: Offline inspect (load + chunk only, zero API calls)
        run: python main.py inspect
        working-directory: raglab

      - name: Dependency sanity
        run: python -m pip check

  # ------------------------------------------------- integration (real API)
  integration-gemini:
    name: Full pipeline (gemini-embedding-2, real API)
    runs-on: ubuntu-latest
    needs: compile-offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Check API key secret and write .env (values never logged)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            KEY="$GEMINI_API_KEY"; SRC="GEMINI_API_KEY"
          elif [ -n "$GOOGLE_API_KEY" ]; then
            KEY="$GOOGLE_API_KEY"; SRC="GOOGLE_API_KEY"
          else
            echo "::error::No API key secret reached this workflow."
            echo "::error::Checked: GEMINI_API_KEY, GOOGLE_API_KEY (both empty)."
            echo "::error::Fix: Settings -> Secrets and variables -> Actions ->"
            echo "::error::      'New repository secret' named exactly 'GEMINI_API_KEY',"
            echo "::error::      scoped to this repository (not an environment, not a variable)."
            echo "::error::Then re-run this workflow (Actions tab -> Run workflow)."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$KEY" > .env
          echo "wrote .env from repository secret: $SRC"

      - name: Run full pipeline integration test
        run: python ci_test.py
        working-directory: raglab

      - name: Upload results (metrics JSON) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-eval-results
          path: raglab/results/
          if-no-files-found: warn

      - name: Report failure details (GitHub issue, best-effort)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd raglab
          {
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "<details><summary>ci_test_error.txt</summary>"
            echo
            echo '```'
            cat results/ci_test_error.txt 2>/dev/null || echo "(no ci_test_error.txt)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>ci_progress.txt (tail)</summary>"
            echo
            echo '```'
            tail -40 results/ci_progress.txt 2>/dev/null || echo "(no ci_progress.txt)"
            echo '```'
            echo
            echo "</details>"
          } > issue_body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "RAGLab CI failed: integration test (run $GITHUB_RUN_ID)" \
            --body-file issue_body.md \
            || echo "issue creation failed (no permission) — annotations carry the summary"

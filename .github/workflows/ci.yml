name: RAGLab CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- offline
  compile-offline:
    name: Compile + offline inspect (no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Compile all modules
        run: python -m py_compile config.py loader.py chunker.py embedder.py store.py evaluate.py answer.py main.py ci_test.py
        working-directory: raglab

      - name: Offline inspect (load + chunk only, zero API calls)
        run: python main.py inspect
        working-directory: raglab

      - name: Dependency sanity
        run: python -m pip check

  # ------------------------------------------------- integration (real API)
  integration-gemini:
    name: Full pipeline (gemini-embedding-2, real API)
    runs-on: ubuntu-latest
    needs: compile-offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Fail clearly if the API key secret is missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY is empty or not configured. Add it in:"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "::error::(this workflow expects the exact name GEMINI_API_KEY)"
            exit 1
          fi

      - name: Write .env from secret (never logged; .env is gitignored)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          echo "wrote .env from GEMINI_API_KEY secret"

      - name: Run full pipeline integration test
        run: python ci_test.py
        working-directory: raglab

      - name: Upload results (metrics JSON) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-eval-results
          path: raglab/results/
          if-no-files-found: warn

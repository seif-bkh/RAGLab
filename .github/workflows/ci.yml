name: RAGLab CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- offline
  compile-offline:
    name: Compile + offline inspect (no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements-benchmark.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-benchmark.txt
        working-directory: raglab

      - name: Compile all modules
        run: python -m compileall -q .
        working-directory: raglab

      - name: Offline regression tests (no API, stubbed HF provider)
        run: |
          python tests_offline.py
          python -m unittest -v test_nvidia_pipeline test_hard_harness
        working-directory: raglab

      - name: Offline inspect (load + chunk only, zero API calls)
        run: python main.py inspect
        working-directory: raglab

      - name: Dependency sanity
        run: python -m pip check

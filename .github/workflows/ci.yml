name: RAGLab CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      legacy-integration:
        description: "Run the historical Gemini/Jina experiments (uses API quota; NVIDIA has its own workflow)."
        type: boolean
        default: false
      real-only:
        description: "Skip fictional-corpus legs (Gemini free tier ~100 RPD); run only docs/ real-docs pipeline."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write  # only used by the failure reporter (never for secrets)

jobs:
  # ---------------------------------------------------------------- offline
  compile-offline:
    name: Compile + offline inspect (no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Compile all modules
        run: python -m py_compile config.py loader.py chunker.py embedder.py store.py evaluate.py answer.py main.py ci_test.py translate.py tests_offline.py
        working-directory: raglab

      - name: Offline regression tests (no API, stubbed HF provider)
        run: python tests_offline.py
        working-directory: raglab

      - name: Offline inspect (load + chunk only, zero API calls)
        run: python main.py inspect
        working-directory: raglab

      - name: Dependency sanity
        run: python -m pip check

  # ------------------------------------------------- integration (real API)
  integration-gemini:
    name: Legacy Gemini/Jina experiments (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.legacy-integration == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compile-offline
    env:
      EMBEDDING_PROVIDER: gemini
      QUERY_TRANSLATION_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raglab/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        working-directory: raglab

      - name: Check API key secret and write .env (values never logged)
        working-directory: raglab   # .env must be next to config.py, not repo root
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            KEY="$GEMINI_API_KEY"; SRC="GEMINI_API_KEY"
          elif [ -n "$GOOGLE_API_KEY" ]; then
            KEY="$GOOGLE_API_KEY"; SRC="GOOGLE_API_KEY"
          else
            echo "::error::No API key secret reached this workflow."
            echo "::error::Checked: GEMINI_API_KEY, GOOGLE_API_KEY (both empty)."
            echo "::error::Fix: Settings -> Secrets and variables -> Actions ->"
            echo "::error::      'New repository secret' named exactly 'GEMINI_API_KEY',"
            echo "::error::      scoped to this repository (not an environment, not a variable)."
            echo "::error::Then re-run this workflow (Actions tab -> Run workflow)."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$KEY" > .env
          echo "wrote .env from repository secret: $SRC"
          # Optional: Jina embeddings A/B provider (EMBEDDING_PROVIDER=jina).
          if [ -n "$JINA_API_KEY" ]; then
            printf 'JINA_API_KEY=%s\n' "$JINA_API_KEY" >> .env
            echo "wrote JINA_API_KEY to .env (optional jina provider leg enabled)"
          else
            echo "JINA_API_KEY secret not set — jina provider leg will be skipped"
          fi
          # Optional: NVIDIA NIM leg (embeddings + query translation A/B).
          if [ -n "$NVIDIA_API_KEY" ]; then
            printf 'NVIDIA_API_KEY=%s\n' "$NVIDIA_API_KEY" >> .env
            echo "wrote NVIDIA_API_KEY to .env (optional nvidia leg enabled)"
          else
            echo "NVIDIA_API_KEY secret not set — nvidia provider leg will be skipped"
          fi

      - name: Restore embedding cache from a previous run (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd raglab
          ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate \
                 --jq '[.artifacts[] | select(.name=="raglab-embed-cache" and .expired==false)][0].id' || true)
          if [ -n "$ART" ] && [ "$ART" != "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" > /tmp/cache.zip || true
            mkdir -p /tmp/cachex && (cd /tmp/cachex && unzip -o -q /tmp/cache.zip || true) || true
            # upload-artifact keeps the workspace-relative path, so locate the
            # file anywhere in the zip instead of assuming a flat layout.
            for CF in embeddings_cache.json embeddings_cache_jina.json embeddings_cache_nvidia.json; do
              CACHE_FILE=$(find /tmp/cachex -name "$CF" | head -1 || true)
              if [ -n "$CACHE_FILE" ] && [ -s "$CACHE_FILE" ]; then
                cp "$CACHE_FILE" "./$CF"
                echo "restored $CF (artifact $ART, $(wc -c < "$CACHE_FILE") bytes)"
              else
                echo "$CF not present in artifact — starting fresh for it"
              fi
            done
            TFILE=$(find /tmp/cachex -name translations_cache.json | head -1 || true)
            if [ -n "$TFILE" ] && [ -s "$TFILE" ]; then
              cp "$TFILE" ./translations_cache.json
              echo "restored translation cache ($(wc -c < translations_cache.json) bytes)"
            fi
          else
            echo "no previous ragLab-embed-cache artifact — starting fresh"
          fi
          TART=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate \
                 --jq '[.artifacts[] | select(.name=="raglab-translation-cache" and .expired==false)][0].id' || true)
          if [ -n "$TART" ] && [ "$TART" != "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$TART/zip" > /tmp/tcache.zip || true
            mkdir -p /tmp/tcachex && (cd /tmp/tcachex && unzip -o -q /tmp/tcache.zip || true) || true
            TFILE=$(find /tmp/tcachex -name translations_cache.json | head -1 || true)
            if [ -n "$TFILE" ] && [ -s "$TFILE" ]; then
              cp "$TFILE" ./translations_cache.json
              echo "restored translation cache (artifact $TART, $(wc -c < translations_cache.json) bytes)"
            else
              echo "translation cache artifact existed but file was missing — starting fresh"
            fi
          fi

      - name: Run full pipeline integration test
        env:
          RAGLAB_CI_REAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.real-only == true && '1' || '0' }}
        run: python ci_test.py
        working-directory: raglab

      - name: Upload results (metrics JSON) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-eval-results
          path: raglab/results/
          if-no-files-found: warn

      - name: Upload embedding cache (resumable quota-friendly ingest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-embed-cache
          path: |
            raglab/embeddings_cache.json
            raglab/embeddings_cache_jina.json
            raglab/embeddings_cache_nvidia.json
          if-no-files-found: warn

      - name: Upload translation cache (reproducible cross-run A/B)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raglab-translation-cache
          path: raglab/translations_cache.json
          if-no-files-found: warn

      - name: Report failure details (GitHub issue, best-effort)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd raglab
          {
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "<details><summary>ci_test_error.txt</summary>"
            echo
            echo '```'
            cat results/ci_test_error.txt 2>/dev/null || echo "(no ci_test_error.txt)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>ci_progress.txt (tail)</summary>"
            echo
            echo '```'
            tail -40 results/ci_progress.txt 2>/dev/null || echo "(no ci_progress.txt)"
            echo '```'
            echo
            echo "</details>"
          } > issue_body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "RAGLab CI failed: integration test (run $GITHUB_RUN_ID)" \
            --body-file issue_body.md \
            || echo "issue creation failed (no permission) — annotations carry the summary"
